plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'cn.edu.sicnu.cs.stu.lantianhao.second'
    compileSdk 35

    defaultConfig {
        applicationId "cn.edu.sicnu.cs.stu.lantianhao.second"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // 实验要求：使用 ViewBinding 以类型安全的方式访问布局中的控件
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'

    // 本地单元测试：用来验证 Model 层的查询逻辑
    testImplementation 'junit:junit:4.13.2'
}
